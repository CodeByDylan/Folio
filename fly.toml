# fly.toml app configuration file generated for folio-wy5daq on 2026-08-09T04:21:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'folio-wy5daq'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_HTTP_PORTS = '8080'
  Api__TrustForwardedHeaders = 'true'
  SnapshotStore__FilePath = '/data/folio-inputs.json'
  SnapshotStore__Mode = 'File'

[[mounts]]
  source = 'folio_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/ready'

[checks]
  [checks.alive]
    port = 8080
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/alive'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
