name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Lint
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore
